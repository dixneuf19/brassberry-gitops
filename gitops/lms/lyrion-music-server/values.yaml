lyrion-music-server:
  common:
    podOptions:
      # TrueCharts' common library defaults this to amd64, which would pin the
      # pod to the single VM worker. Must be null, not {}, to actually override.
      nodeSelector: null
  TZ: "Europe/Paris"
  workload:
    main:
      podSpec:
        hostname: lyrion-music-server
