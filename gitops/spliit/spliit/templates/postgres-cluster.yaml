apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spliit
spec:
  instances: 2
  enablePDB: false # only one instance, will block upgrades
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: spliit-backup
  storage:
    storageClass: local-path
    size: 10Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: k8s-worker-1
  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "512Mi"
  bootstrap:
    initdb:
      database: spliit
