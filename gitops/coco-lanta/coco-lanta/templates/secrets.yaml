# Generated once in the cluster, never stored anywhere else.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: livekit-secret
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coco-lanta-livekit
spec:
  refreshPolicy: CreatedOnce
  target:
    name: coco-lanta-livekit
    template:
      data:
        secret: "{{ "{{" }} .password {{ "}}" }}"
        # LIVEKIT_KEYS format: "<key>: <secret>"
        keys: "{{ .Values.livekit.apiKey }}: {{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: livekit-secret
