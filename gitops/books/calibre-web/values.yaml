replicaCount: 1

image:
  repository: lscr.io/linuxserver/calibre-web
  tag: "0.6.27@sha256:1870b57874a831d7c0c389547826e5be38089c437276299e1646b7c81a497347"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

# linuxserver s6 image: starts as root to chown the volumes, then drops to PUID/PGID
securityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL

# Init and backup containers: root (they chown / read files owned by PUID) with only file caps
helperSecurityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

ingress:
  enabled: true
  className: "traefik"
  clusterIssuer: "letsencrypt"
  host: books.dixneuf19.fr
  tlsSecretName: books-dixneuf19-fr-tls
  # Applied to the web UI only; the Kobo API under /kobo/ authenticates by token in the URL
  webAuthMiddleware: traefik-basic-auth@kubernetescrd

resources:
  limits:
    cpu: 2
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector:
  kubernetes.io/hostname: k8s-worker-1

tolerations: []

affinity: {}

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Paris"

secretEnvVars: []

# files/10-kobo-fixes.sh, run as root by the linuxserver image before the app starts: works around
# two 0.6.27 bugs that break Kobo sync (janeczku/calibre-web#3691, #3679)
customInit:
  enabled: true

# Empty Calibre library copied into /books on first boot (Calibre-Web cannot create one itself)
seedLibrary:
  url: https://raw.githubusercontent.com/janeczku/calibre-web/0.6.27/library/metadata.db
  sha256: fac2f7e37ef4bc0fb2955e9a3f612604707d4ef573af5c28bd7a8369339f4bd4

persistence:
  config:
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /config
  books:
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    size: 20Gi
    mountPath: /books

startupProbe:
  httpGet:
    path: /login
    port: 8083
  periodSeconds: 5
  failureThreshold: 36

livenessProbe:
  httpGet:
    path: /login
    port: 8083
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /login
    port: 8083
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Nightly db tarball + weekly full library tarball to the NAS, see files/backup.sh
backup:
  enabled: true
  schedule: "45 3 * * *"
  dbRetentionDays: 14
  fullRetentionDays: 35
  fullBackupWeekday: 7
  image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  persistence:
    storageClass: "nfs-jonbonas"
    size: 50Gi
