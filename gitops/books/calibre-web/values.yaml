replicaCount: 1

image:
  repository: lscr.io/linuxserver/calibre-web
  # Master snapshot, not a release: 0.6.27 is missing the two Kobo sync fixes (#3679, #3691),
  # which are merged upstream but unreleased. Immutable tag, so it never follows `nightly`.
  tag: "nightly-a9782640-ls375@sha256:9d9e1cb9621bf2368536ec847f3b2f42cb66b2ce786c64967aab242eeef9719f"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

# linuxserver s6 image: starts as root to chown the volumes, then drops to PUID/PGID
securityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL

# Init and backup containers: root (they chown / read files owned by PUID) with only file caps
helperSecurityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

ingress:
  enabled: true
  className: "traefik"
  clusterIssuer: "letsencrypt"
  host: books.dixneuf19.fr
  tlsSecretName: books-dixneuf19-fr-tls
  # Applied to the web UI only; the Kobo API under /kobo/ authenticates by token in the URL
  webAuthMiddleware: traefik-basic-auth@kubernetescrd

resources:
  limits:
    cpu: 2
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector:
  kubernetes.io/hostname: k8s-worker-1

tolerations: []

affinity: {}

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Paris"

secretEnvVars: []

# Empty Calibre library copied into /books on first boot (Calibre-Web cannot create one itself)
seedLibrary:
  url: https://raw.githubusercontent.com/janeczku/calibre-web/0.6.27/library/metadata.db
  sha256: fac2f7e37ef4bc0fb2955e9a3f612604707d4ef573af5c28bd7a8369339f4bd4

persistence:
  config:
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /config
  books:
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    size: 20Gi
    mountPath: /books

startupProbe:
  httpGet:
    path: /login
    port: 8083
  periodSeconds: 5
  failureThreshold: 36

livenessProbe:
  httpGet:
    path: /login
    port: 8083
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /login
    port: 8083
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Nightly db tarball + nightly book mirror + weekly full library tarball to the NAS,
# see files/backup.sh
backup:
  enabled: true
  schedule: "45 3 * * *"
  dbRetentionDays: 14
  fullRetentionDays: 35
  fullBackupWeekday: 7
  # Mirror keeps the book files at a 1-day RPO without storing a full tarball per night
  mirrorBooks: true
  image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  persistence:
    storageClass: "nfs-jonbonas"
    size: 50Gi
