apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: burrito-admin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: burrito-admin-credentials
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: '{{ "{{ .username }}" }}'
        password: '{{ "{{ .password }}" }}'
  data:
    - secretKey: username
      remoteRef:
        key: basic-auth-username
    - secretKey: password
      remoteRef:
        key: basic-auth-password
