apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bandajoe-fr
spec:
  secretName: bandajoe-fr-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - bandajoe.fr
    - www.bandajoe.fr
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: traefik-gateway-certs
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik
  to:
    - group: ""
      kind: Secret
      name: bandajoe-fr-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bandajoe
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: bandajoe
    - name: traefik-gateway
      namespace: traefik
      sectionName: bandajoe-www
  hostnames:
    - bandajoe.fr
    - www.bandajoe.fr
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: meteo.mangococo.fr
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
