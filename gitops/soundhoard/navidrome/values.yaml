navidrome:
  env:
    ND_MUSICFOLDER: /music
    ND_LOGLEVEL: info
    ND_SCANNER_SCHEDULE: "@every 15m"
    ND_PROMETHEUS_ENABLED: "false"

  # SQLite must not live on NFS, and local-path pins it to this node
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1

  envFrom:
    - secretRef:
        name: navidrome-secrets

  service:
    main:
      monitor:
        enabled: false

  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - host: navidrome.dixneuf19.fr
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: navidrome-tls
          hosts:
            - navidrome.dixneuf19.fr

  persistence:
    data:
      enabled: true
      mountPath: /data
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 2Gi
      annotations:
        # local-path reclaim is Delete: pruning this PVC destroys the data
        argocd.argoproj.io/sync-options: Prune=false
    music:
      enabled: true
      mountPath: /music
      existingClaim: soundhoard-music
      readOnly: true
