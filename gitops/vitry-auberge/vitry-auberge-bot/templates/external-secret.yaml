apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vitry-auberge-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vitry-auberge-bot
  data:
    - secretKey: BOT_TELEGRAM_TOKEN
      remoteRef:
        key: vitry-auberge-bot-telegram-token
