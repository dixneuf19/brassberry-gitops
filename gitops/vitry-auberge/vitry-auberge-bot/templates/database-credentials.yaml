# The auberge role's password is generated in playground-db (see the
# playground-db chart). This copies it here, read-only, through a dedicated
# service account that is allowed to read that one secret and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-db-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: playground-db
spec:
  provider:
    kubernetes:
      remoteNamespace: playground-db
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: playground-db-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auberge-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: playground-db
    kind: SecretStore
  target:
    name: auberge-db
  data:
    - secretKey: username
      remoteRef:
        key: auberge-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: auberge-db-credentials
        property: password
