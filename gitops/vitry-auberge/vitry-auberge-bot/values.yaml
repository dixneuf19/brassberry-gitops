generic:
  replicaCount: 1
  image:
    repository: ghcr.io/dixneuf19/vitry-auberge-bot
    tag: main@sha256:d71b9f570f956ee6fb08f2ffc684443fbec40f6732b8529d32ad326a81c1b0d3
  container:
    port: 80
    noProbes: true
  resources:
    limits:
      memory: 128Mi
    requests:
      memory: 64Mi
      cpu: 50m
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  configmap:
    CHAT_ID: "-892338668"
    DB_HOST: "playground-rw.playground-db.svc"
    DB_PORT: "5432"
    DB_NAME: "auberge"
  secrets:
    - name: vitry-auberge-bot
      key: BOT_TELEGRAM_TOKEN
    # Copied from playground-db by templates/database-credentials.yaml
    - name: auberge-db
      key: username
      alias: DB_USER
    - name: auberge-db
      key: password
      alias: DB_PASSWORD
