traefik:
  providers:
    kubernetesIngress:
      enabled: true
      publishedService:
        enabled: true
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesGateway:
      enabled: false # Phase B: Gateway API migration

  service:
    type: NodePort
  ports:
    web:
      nodePort: 32080
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      nodePort: 32443

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  deployment:
    replicas: 2

  metrics:
    prometheus:
      # The chart hard-fails rendering when monitoring.coreos.com/v1 is absent.
      # The CI diff-preview cluster has no Prometheus Operator, so keep the
      # ServiceMonitor renderable there; the real cluster has the CRD.
      disableAPICheck: true
      entryPoint: metrics
      service:
        enabled: true
      serviceMonitor:
        enabled: true
        namespace: monitoring

  log:
    level: INFO
