traefik:
  providers:
    kubernetesIngress:
      enabled: true
      # the Service is a NodePort behind the Oracle VM, so it has no LB status to publish
      publishedService:
        enabled: false
      ingressEndpoint:
        hostname: brassberry.dixneuf19.fr
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesGateway:
      enabled: true

  gateway:
    listeners:
      bandajoe:
        port: 8443
        protocol: HTTPS
        hostname: bandajoe.fr
        namespacePolicy: &redirects
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: redirects
        certificateRefs: &bandajoe-cert
          - name: bandajoe-fr-tls
            namespace: redirects
      bandajoe-www:
        port: 8443
        protocol: HTTPS
        hostname: www.bandajoe.fr
        namespacePolicy: *redirects
        certificateRefs: *bandajoe-cert

  service:
    spec:
      type: NodePort
  ports:
    web:
      nodePort: 32080
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      nodePort: 32443

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  deployment:
    replicas: 2

  metrics:
    prometheus:
      # The chart hard-fails rendering when monitoring.coreos.com/v1 is absent.
      # The CI diff-preview cluster has no Prometheus Operator, so keep the
      # ServiceMonitor renderable there; the real cluster has the CRD.
      disableAPICheck: true
      entryPoint: metrics
      service:
        enabled: true
      serviceMonitor:
        enabled: true
        namespace: monitoring

  log:
    level: INFO
