apiVersion: config.terraform.padok.cloud/v1alpha1
kind: TerraformRepository
metadata:
  name: brassberry-gitops
spec:
  repository:
    url: https://github.com/dixneuf19/brassberry-gitops
  terraform:
    enabled: true
  remediationStrategy:
    autoApply: false
  overrideRunnerSpec:
    serviceAccountName: runner-homelab
    # burrito hardcodes `terraform init -upgrade`, so plan and apply each rebuild
    # the lock and record an h1 hash for their own platform. Split them across
    # arches and apply rejects the plan. Merged into every layer.
    nodeSelector:
      kubernetes.io/arch: arm64
    envFrom:
      - secretRef:
          name: burrito-runner-common
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
