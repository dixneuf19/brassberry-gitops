apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sfr-mms-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sfr-mms-bot
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: sfr-mms-bot-telegram-token
