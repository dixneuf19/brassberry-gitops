apiVersion: v1
kind: Service
metadata:
  name: jonbonas
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: proxmox-jonbonas@kubernetescrd
spec:
  type: ExternalName
  # ArgoCD excludes Endpoints/EndpointSlice from sync, so a selector-less Service can't be used
  externalName: 192.168.1.30
  ports:
    - name: https
      port: 8006
