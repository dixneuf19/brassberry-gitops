apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: basic-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: basic-auth
    template:
      engineVersion: v2
      data:
        users: '{{ .username }}:{{ .password | bcrypt }}'
  data:
    - secretKey: username
      remoteRef:
        key: basic-auth-username
    - secretKey: password
      remoteRef:
        key: basic-auth-password
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
spec:
  basicAuth:
    secret: basic-auth
    # keep the Authorization header away from pveproxy, which parses it for API tokens
    removeHeader: true
