apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jonbonas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: proxmox-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jonbonas.dixneuf19.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jonbonas
                port:
                  number: 8006
  tls:
    - hosts:
        - jonbonas.dixneuf19.fr
      secretName: jonbonas-dixneuf19-fr-tls
